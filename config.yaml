# 좌표는 전부 1440x3120 기준. 폰 해상도가 달라도 알아서 환산해.
serial: null            # 폰이 여러 대일 때만 `adb devices` 의 시리얼

walk:
  origin: [720, 2400]   # 드래그 시작점. 아무 UI도 없는 땅 위가 좋음
  radius: 220           # 조이스틱 이동 거리(px)
  chunk_seconds: 1.5    # 이 간격마다 화면을 확인함
  jitter: 8             # 탭/드래그 좌표 흔들기(px)

map:                    # 지도를 열어 둔 채 내 점(파란 점)을 목표 좌표로 밀어서 이동
  open_button: [125, 2542]   # 왼쪽 지도 아이콘
  close_button: [1322, 245]  # 지도 창의 빨간 X
  threshold: 0.8             # 점/집 아이콘 인식 임계값
  arrive_px: 25              # 목표에서 이 거리(지도 px) 안이면 도착
  px_per_second: 24          # 1초 걸으면 지도에서 대략 몇 px 움직이는지 (calibrate 결과: 약 22~27)
  max_step_seconds: 1.5      # 한 번에 걷는 최대 시간. 이 간격마다 점 위치를 다시 읽음
  goto_timeout_seconds: 90   # 한 지점으로 가는 데 쓰는 최대 시간

detect:
  bag_roi: [350, 1950, 1100, 2250]       # "MAX" 바가 뜨는 영역
  bag_full_threshold: 0.8
  home_icon_roi: [900, 1300, 1400, 1900] # 필드에서만 보이는 집 아이콘 영역 (지도를 닫았을 때)
  home_icon_threshold: 0.7

town:
  circle: [759, 1443]       # 입금되는 큰 점선 원의 지도 좌표 (where 로 확인해서 수정!)
  deposit_wait_seconds: 6   # 원 안에서 입금될 때까지 대기
  deposit_retries: 5

route:
  approach: []   # 마을 점선 원 -> 사냥터 시작점으로 가는 길 (record approach). 귀환 때는 거꾸로 되짚는다
  # 사냥터 순찰 지점들의 지도 좌표 [x, y]. 순서대로 돌고 끝나면 처음부터 반복.
  # `python -m xphero where` 를 켜 두고 원하는 곳까지 직접 걸으면서 좌표를 적어.
  patrol: []
  # 예) patrol: [[700, 1300], [850, 1250], [820, 1400]]

# 던전/컨텐츠: 마을에 도착해 입금한 뒤, 주기가 된 것만 실행.
tasks:
  - name: example_dungeon
    enabled: false
    every_minutes: 180
    steps:
      - {tap: [1200, 2500]}              # 좌표 탭
      - {wait: 1.5}
      - {tap_template: dungeon_enter, timeout: 6}   # templates/dungeon_enter.png 를 찾아 탭
      - {wait_template: dungeon_done, timeout: 120, optional: true}
